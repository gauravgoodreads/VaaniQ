# Upstream FastAPI service (compose DNS name: api)
upstream vaaniq_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container liveness for compose HEALTHCHECK (not the Python API).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Proxy API + OpenAPI to the backend (same-origin for the SPA).
    location /health {
        proxy_pass http://vaaniq_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://vaaniq_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 26m;
    }

    location /openapi.json {
        proxy_pass http://vaaniq_api;
        proxy_set_header Host $host;
    }

    # SPA /docs is the in-app documentation page. Swagger stays on API :8000/docs.
    # Do not steal the SPA route.

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
