[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vaaniq"
version = "0.1.0"
description = "VaaniQ: cross-lingual, compression-robust AI-voice detection for Indian languages with calibrated reliability"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
  { name = "VaaniQ Team (MPSTME Capstone A.Y. 2026-27)" },
]
keywords = ["deepfake", "audio", "indic", "calibration", "aasist", "xls-r"]
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "structlog>=24.1,<26",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.30,<3",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "httpx2>=2.10,<3",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6.0,<7",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5.0,<7",
  "pytest-asyncio>=0.23,<1",
  "hypothesis>=6.100,<7",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "types-PyYAML>=6.0,<7",
  "pre-commit>=3.7,<5",
]
ml = [
  # Installed in P4/P5 (ROADMAP-025+). Kept optional so scaffold stays CPU/CI-light.
  "torch>=2.2,<3",
  "torchaudio>=2.2,<3",
  "transformers>=4.40,<5",
]
postgres = [
  # Compose / prod profile (ASSUMPTION: OQ-021).
  "psycopg[binary]>=3.1,<4",
]

[project.urls]
Documentation = "https://github.com/local/vaaniq/tree/main/docs"
Source = "https://github.com/local/vaaniq"

[tool.hatch.build.targets.wheel]
packages = ["src/vaaniq"]

[tool.hatch.build.targets.sdist]
include = ["src/vaaniq", "tests", "README.md"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "RUF", # ruff
  "ANN", # annotations
  "D",   # docstrings
]
ignore = [
  "D100", # missing module docstring — packages use README.md
  "D104", # missing package docstring
  "ANN401", # Any is forbidden by policy; ignore rule that allows it
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN"]
"scripts/**/*.py" = ["T201"]
"src/vaaniq/persistence/alembic/**/*.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_reexport = true
pretty = true
show_error_codes = true
mypy_path = "src"
packages = ["vaaniq"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["vaaniq.persistence.alembic.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=vaaniq",
  "--cov-report=term-missing",
  "--cov-fail-under=80",
]
markers = [
  "integration: hits disk/network/GPU; excluded from default CI fast lane",
  "xfail_roadmap: deferred implementation tied to ROADMAP-###",
]
filterwarnings = [
  "error",
  # Starlette 1.6 prefers httpx2; keep httpx allowed until ecosystem settles.
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["vaaniq"]
omit = [
  # Alembic env/scripts are exercised via command API, not unit import coverage.
  "*/persistence/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "raise NotImplementedInPhaseError",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
]
show_missing = true
skip_covered = false
